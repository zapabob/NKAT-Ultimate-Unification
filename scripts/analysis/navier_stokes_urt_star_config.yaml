# Navier–Stokes URT★ RTX3080高機能実装用 設定ファイル
# 格子サイズ・粘性・時間刻み・非可換パラメータ・URT展開等を柔軟に指定

nx: 32         # x方向格子点数
ny: 32         # y方向格子点数
nz: 32         # z方向格子点数
nu: 0.01       # 粘性係数

# 時間積分パラメータ
nsteps: 100    # 時間ステップ数
dt: 0.01       # 時間刻み幅

# 非可換パラメータ（プランク長^2）
theta: 2.612e-70

# 時間積分法（rk4, euler, crank-nicolson から選択）
method: rk4

# Moyal積の次数（1以上で高次補正）
moyal_order: 1

# URT展開用リーマン零点スペクトル（最初の5個例）
urt_modes:
  - 14.134725
  - 21.022040
  - 25.010858
  - 30.424876
  - 32.935062 